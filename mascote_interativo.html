<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mascote Interativo - Camadas SVG</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .canvas {
            width: 450px;
            height: 450px;
            position: relative;
        }

        /* Animação do Rabo (Tail Part) */
        .svg-tail {
            transform-origin: 135px 145px;
            animation: abanarRabo 0.15s ease-in-out infinite alternate;
        }

        /* Controle Dinâmico da Cabeça (Head Part) */
        .svg-head-group {
            transform-origin: 100px 112px; /* Pivô exato no centro do pescoço/coleira */
            transition: transform 0.06s ease-out;
            will-change: transform;
        }

        @keyframes abanarRabo {
            0% { transform: rotate(-6deg); }
            100% { transform: rotate(12deg); }
        }
    </style>
</head>
<body>

    <div class="canvas" id="canvasMascote">
        <svg viewBox="0 0 200 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
            
            <circle cx="100" cy="100" r="85" fill="#4fa7ff" />

            <g id="part-tail" class="svg-tail">
                <path d="M 132 136 C 148 130, 162 112, 156 100 C 148 110, 138 122, 132 136 Z" fill="#cbd5e1" />
                <path d="M 128 142 C 152 138, 168 116, 162 102 C 152 114, 136 128, 128 142 Z" fill="#ffffff" />
            </g>

            <g id="part-body">
                <ellipse cx="100" cy="172" rx="42" ry="7" fill="#1d4ed8" opacity="0.3" />
                
                <ellipse cx="100" cy="140" rx="34" ry="32" fill="#ffffff" />
                
                <path d="M 125 120 C 134 128, 134 142, 126 150 C 118 140, 118 126, 125 120 Z" fill="#cbd5e1" />
                
                <rect x="74" y="145" width="15" height="28" rx="7.5" fill="#ffffff" />
                <path d="M 74 165 C 74 173, 89 173, 89 165 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5" />
                
                <rect x="111" y="145" width="15" height="28" rx="7.5" fill="#ffffff" />
                <path d="M 111 165 C 111 173, 126 173, 126 165 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5" />

                <path d="M 74 114 Q 100 128 126 114" stroke="#1e293b" stroke-width="8" stroke-linecap="round" fill="none" />
                
                <circle cx="100" cy="126" r="7" fill="#1d4ed8" />
                <circle cx="100" cy="126" r="3" fill="#ffffff" />
            </g>

            <g id="part-head-group" class="svg-head-group">
                
                <g id="sub-left-ear">
                    <path d="M 66 74 C 42 40, 22 52, 44 88 Z" fill="#ffffff" />
                    <path d="M 58 74 C 42 54, 30 62, 44 84 Z" fill="#475569" />
                </g>

                <g id="sub-right-ear">
                    <path d="M 134 74 C 158 40, 178 52, 156 88 Z" fill="#ffffff" />
                    <path d="M 142 74 C 158 54, 170 62, 156 84 Z" fill="#e2e8f0" />
                </g>

                <circle cx="100" cy="88" r="38" fill="#ffffff" />
                
                <path d="M 68 84 C 68 70, 92 68, 92 86 C 92 98, 68 98, 68 84 Z" fill="#e2e8f0" />

                <g id="sub-eyes">
                    <circle cx="82" cy="84" r="5.5" fill="#0f172a" />
                    <circle cx="80" cy="82" r="1.5" fill="#ffffff" />
                    <circle cx="118" cy="84" r="5.5" fill="#0f172a" />
                    <circle cx="116" cy="82" r="1.5" fill="#ffffff" />
                </g>

                <path d="M 76 74 Q 82 72 86 75" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none" />
                <path d="M 114 74 Q 118 72 124 75" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" fill="none" />

                <g id="sub-mouth">
                    <ellipse cx="100" cy="93" rx="7.5" ry="5" fill="#0f172a" />
                    <circle cx="98" cy="91" r="1" fill="#ffffff" />
                    
                    <path d="M 91 97 Q 100 105 109 97" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round" />
                    <path d="M 95 100 C 95 109, 105 109, 105 100 Z" fill="#f43f5e" />
                </g>

                <path d="M 84 112 Q 100 118 116 112" stroke="#1e293b" stroke-width="3" fill="none" />

            </g>
        </svg>
    </div>

    <script>
        const canvas = document.getElementById('canvasMascote');
        const headGroup = document.getElementById('part-head-group');

        window.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            
            // Ponto central de ancoragem do pescoço
            const pX = rect.left + rect.width / 2;
            const pY = rect.top + rect.height * 0.56;

            const dX = e.clientX - pX;
            const dY = e.clientY - pY;
            const distance = Math.sqrt(dX * dX + dY * dY) || 1;

            // Constantes de deslocamento para manter o encaixe perfeito das camadas
            const maxTranslation = 9; 
            const maxRotation = 10;   

            const targetX = (dX / distance) * Math.min(Math.abs(dX) * 0.05, maxTranslation);
            const targetY = (dY / distance) * Math.min(Math.abs(dY) * 0.05, maxTranslation);
            const targetRotate = (dX / distance) * maxRotation;

            // Aplica a transformação diretamente no grupo que une a cabeça inteira
            headGroup.style.transform = `translate(${targetX}px, ${targetY}px) rotate(${targetRotate}deg)`;
        });
    </script>
</body>
</html>
